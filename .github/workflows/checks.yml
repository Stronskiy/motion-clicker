name: Core checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      windows_only:
        description: "Run focused Windows checks without queuing a hosted Mac"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows-core:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: windows/global.json
      - name: Toolchain
        working-directory: windows
        run: dotnet --info | Tee-Object -FilePath dotnet-info.log
      - name: Repository hygiene
        run: python scripts/check-repository-hygiene.py
      - name: Restore locked test dependencies
        working-directory: windows
        run: dotnet restore MotionClicker.Core.Tests/MotionClicker.Core.Tests.csproj --locked-mode | Tee-Object -FilePath dotnet-restore.log
      - name: Test pure core
        working-directory: windows
        run: |
          dotnet test MotionClicker.Core.Tests/MotionClicker.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx" --results-directory TestResults | Tee-Object -FilePath dotnet-test.log
          exit $LASTEXITCODE
      - name: Build native WinUI application
        if: ${{ !cancelled() }}
        working-directory: windows
        run: |
          dotnet restore MotionClicker.Windows/MotionClicker.Windows.csproj --locked-mode | Tee-Object -FilePath winui-restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build MotionClicker.Windows/MotionClicker.Windows.csproj -c Release --no-restore -p:Platform=x64 | Tee-Object -FilePath winui-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "MotionClicker.Windows/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64/Assets/MotionClicker.ico")) { throw "Runtime window icon missing from native build output" }
      - name: Test generated target log analysis
        run: python -m unittest discover -s scripts/tests -v
      - name: Build separate native generated target fixture
        if: ${{ !cancelled() }}
        working-directory: windows
        run: |
          dotnet restore MotionClicker.Fixture/MotionClicker.Fixture.csproj --locked-mode | Tee-Object fixture-restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build MotionClicker.Fixture/MotionClicker.Fixture.csproj -c Release --no-restore -p:Platform=x64 | Tee-Object fixture-build.log
          exit $LASTEXITCODE
      - name: Package exact-source native application and separate fixture
        run: scripts/package-windows-controlled.ps1
      - name: Resolved packages
        if: always()
        working-directory: windows
        run: dotnet list MotionClicker.Core.Tests/MotionClicker.Core.Tests.csproj package --include-transitive | Tee-Object -FilePath dotnet-packages.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-core-evidence
          path: |
            windows/*.log
            windows/TestResults/
            windows/MotionClicker.Core.Tests/packages.lock.json
            windows/MotionClicker.Windows/packages.lock.json
            windows/MotionClicker.Fixture/packages.lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-native-preview
          path: windows/MotionClicker.Windows/bin/x64/Release/net10.0-windows10.0.26100.0/win-x64/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-controlled-package
          path: |
            dist/controlled/*/windows/*.zip
            dist/controlled/*/windows/artifact-identity.json
            dist/controlled/*/windows/SHA256SUMS
  macos-core:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.windows_only }}
    runs-on: macos-26
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version | tee swift-info.log
      - name: Repository hygiene
        run: python3 scripts/check-repository-hygiene.py
      - name: Build and test pure core
        run: swift test --package-path macos -c release 2>&1 | tee swift-test.log
      - name: Test generated target log analysis
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Package native macOS application and separate fixture
        run: scripts/package-macos-controlled.sh 2>&1 | tee swift-app.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-controlled-package
          path: |
            dist/controlled/*/macos/*.zip
            dist/controlled/*/macos/artifact-identity.json
            dist/controlled/*/macos/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: macos-core-evidence
          path: swift-*.log
