name: Windows recording synthetic probe
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-native:
    runs-on: windows-2025
    timeout-minutes: 10
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          global-json-file: windows/global.json
      - name: Restore locked native adapter, probe and app dependencies
        run: |
          dotnet restore MotionClicker.Recording.Probe/MotionClicker.Recording.Probe.csproj --locked-mode | Tee-Object probe-restore.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore MotionClicker.Windows/MotionClicker.Windows.csproj --locked-mode | Tee-Object probe-app-restore.log
          exit $LASTEXITCODE
      - name: Generated device, surface, H264 and native readback (no screen or input)
        run: |
          dotnet run --project MotionClicker.Recording.Probe -c Release --no-restore | Tee-Object probe-native.log
          exit $LASTEXITCODE
      - name: Recording clock, pointer and source timeline behavior
        if: always()
        run: |
          dotnet restore MotionClicker.Core.Tests/MotionClicker.Core.Tests.csproj --locked-mode
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test MotionClicker.Core.Tests/MotionClicker.Core.Tests.csproj -c Release --no-restore --filter "FullyQualifiedName~WindowsRecordingClockTests|FullyQualifiedName~WindowsPointerAdapterTests|FullyQualifiedName~WindowsStreamTimelineTests" | Tee-Object probe-clock.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-recording-probe-evidence
          path: |
            windows/probe-*.log
            windows/MotionClicker.Recording.Probe/packages.lock.json
            windows/MotionClicker.Recording.Windows/packages.lock.json
            windows/MotionClicker.Windows/packages.lock.json
